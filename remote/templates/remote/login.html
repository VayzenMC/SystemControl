<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | XNS Remote Control</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0d1117; color: #f0f6fc; font: 16px system-ui, sans-serif; }
    form { width: min(360px, calc(100% - 40px)); padding: 28px; background: #161b22; border: 1px solid #30363d; border-radius: 8px; box-sizing: border-box; }
    h1 { margin: 0 0 22px; font-size: 24px; color: #58a6ff; }
    label { display: block; margin: 14px 0 6px; color: #8b949e; }
    input { width: 100%; box-sizing: border-box; padding: 11px; border: 1px solid #30363d; border-radius: 6px; background: #0d1117; color: #f0f6fc; font-size: 16px; }
    button { width: 100%; margin-top: 22px; padding: 11px; border: 0; border-radius: 6px; background: #238636; color: white; font-size: 16px; cursor: pointer; }
    .error { color: #ff7b72; margin: 0 0 12px; }
  </style>
</head>
<body>
  <form method="post">
    {% csrf_token %}
    <h1>XNS Remote Control</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <label for="username">Login</label>
    <input id="username" name="username" autocomplete="username" required autofocus>
    <label for="password">Parol</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Kirish</button>
  </form>
</body>
</html>
